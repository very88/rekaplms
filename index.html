<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Beranda - LMS SMANJO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #f8fafc; 
            background-image: radial-gradient(circle at 50% 0%, #ffffff 0%, #f1f5f9 100%); 
            color: #334155; 
            min-height: 100vh; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .glass-panel { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(226, 232, 240, 0.8); 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); 
        }
        .modern-input {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            transition: all 0.2s ease-in-out;
        }
        .modern-input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen justify-between p-4 md:p-8">

    <!-- Top Navigation / Shortcut Monitoring -->
    <header class="w-full max-w-5xl mx-auto flex justify-between items-center glass-panel rounded-2xl p-4 mb-6">
        <div class="flex items-center gap-3">
            <div class="bg-sky-500 text-white font-black px-3 py-1.5 rounded-xl text-sm shadow-sm">SMANJO</div>
            <span class="font-bold text-slate-800 text-sm hidden sm:inline">Learning Management System</span>
        </div>
        <div>
            <a href="dashboard-monitoring.html" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 font-bold text-xs sm:text-sm px-4 py-2 rounded-xl transition-colors shadow-2xs flex items-center gap-2">
                <span>📊</span> Dashboard Monitoring (Kepsek / Kurikulum)
            </a>
        </div>
    </header>

    <!-- Main Container Login -->
    <main class="w-full max-w-md mx-auto glass-panel rounded-3xl p-8 shadow-xl my-auto">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-slate-800 tracking-tight">Selamat Datang 👋</h1>
            <p class="text-xs text-slate-500 mt-1">Silakan masuk menggunakan akun LMS SMANJO Anda.</p>
        </div>

        <form id="formLogin" onsubmit="prosesLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Email</label>
                <input type="email" id="email" required class="w-full rounded-xl px-4 py-2.5 modern-input text-sm" placeholder="nama@email.com">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Password</label>
                <input type="password" id="password" required class="w-full rounded-xl px-4 py-2.5 modern-input text-sm" placeholder="••••••••">
            </div>

            <button type="submit" id="btnLogin" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 rounded-xl transition-colors shadow-md text-sm cursor-pointer mt-2">
                Masuk ke Sistem
            </button>
        </form>

        <div class="text-center mt-6 pt-4 border-t border-slate-100">
            <p class="text-xs text-slate-500">Belum punya akun? <a href="register.html" class="text-sky-600 font-bold hover:underline">Daftar di sini</a></p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-5xl mx-auto text-center text-xs text-slate-400 py-4">
        &copy; 2026 SMAN 1 Wongsorejo (SMANJO). All rights reserved.
    </footer>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyTICgF-NqTCpCw3A38R_wgxJ9AZZiXB9Y1yYaGG81LtyaRRUG95qBimEZ_5snTYoxj/exec';

        window.onload = function() {
            // Jika sudah login, langsung arahkan ke dashboard masing-masing
            if (localStorage.getItem('lms_user')) {
                const user = JSON.parse(localStorage.getItem('lms_user'));
                if (user.role === 'Guru') window.location.href = 'dashboard-guru.html';
                else if (user.role === 'Siswa') window.location.href = 'dashboard-siswa.html';
                else if (user.role === 'Kepala Sekolah') window.location.href = 'dashboard-monitoring.html';
            }
        };

        async function prosesLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.innerText = 'Memproses...';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', email: email, password: password })
                });
                const result = await res.json();

                if (result.status === 'success') {
                    localStorage.setItem('lms_user', JSON.stringify(result.data));
                    
                    if (result.data.role === 'Guru') {
                        window.location.href = 'dashboard-guru.html';
                    } else if (result.data.role === 'Siswa') {
                        window.location.href = 'dashboard-siswa.html';
                    } else if (result.data.role === 'Kepala Sekolah') {
                        window.location.href = 'dashboard-monitoring.html';
                    } else {
                        window.location.href = 'dashboard-siswa.html';
                    }
                } else {
                    alert(`Login Gagal: ${result.message}`);
                    btn.disabled = false;
                    btn.innerText = 'Masuk ke Sistem';
                }
            } catch (err) {
                console.error(err);
                alert("Terjadi kesalahan jaringan.");
                btn.disabled = false;
                btn.innerText = 'Masuk ke Sistem';
            }
        }
    </script>
</body>
</html>
